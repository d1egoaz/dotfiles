# Canonical model routing registry.
#
# This file is the only hand-edited source for active Codex model IDs, model
# labels, tier defaults, role routes, and runtime capability differences.
# Generated outputs are consumed by Codex, Nix, and the routing reference. Run
# `just agent-routing-generate` after changing this file.

schema_version = 1
tiers = ["economy", "balanced", "frontier"]
efforts = ["none", "low", "medium", "high", "xhigh", "max", "ultra"]

[roles.explorer]
description = "Use for read-only research: trace code paths, build inventories, and gather evidence with file references. Run one per independent area."
tier = "balanced"
effort = "low"
sandbox_mode = "read-only"
canonical_name = "spawn-subagent-explore"
# Claude Code: start without user and project CLAUDE.md, like the built-in Explore.
claude_omit_claude_md = true
capabilities = ["read", "search", "synthesis", "web"]
developer_instructions = """
Stay in exploration mode. Trace real code paths, gather exact evidence, and return concise findings with file or command references. Mark anything you couldn't confirm and say where you looked. Do not edit files or propose broad fixes unless the parent asks for options. Do not message or coordinate with peer agents, discover peer IDs, or spawn descendants. Return complete findings only to the parent lead.
"""

[roles.reviewer]
description = "Use for one independent read-only review before publishing: merge-blocking correctness, security, and regression problems only."
tier = "balanced"
effort = "low"
sandbox_mode = "read-only"
canonical_name = "spawn-subagent-review"
capabilities = ["read", "search", "adversarial", "web"]
developer_instructions = """
List only problems you'd block the merge for. For each one, give the file and line, why it's wrong, and how to show it fails. Treat missing evidence as unknown, never as success; mark anything you couldn't confirm and say where you looked. Do not edit files. Do not message or coordinate with peer agents, discover peer IDs, spawn descendants, or declare the overall task complete. Return complete findings only to the parent lead.
"""

[roles.worker]
description = "Use for a bounded implementation or fix once scope, owned files, and the finish line are clear."
tier = "economy"
effort = "xhigh"
sandbox_mode = "workspace-write"
canonical_name = "spawn-subagent-implement"
capabilities = ["read", "search", "write", "test", "web"]
developer_instructions = """
Own only the assigned write set. Preserve unrelated work, do not revert edits made by others, implement the smallest complete change, verify the stated finish line, and report changed files, validation, and remaining risks. Do not message or coordinate with peer agents, discover peer IDs, spawn descendants, accept scope changes from them, or declare the overall task complete. Return complete results only to the parent lead.
"""

[runtimes.office_codex]
display_name = "Office Codex"
provider = "codex"
lead_tier = "frontier"
default_tier = "economy"
opencode_go = false

[runtimes.office_codex.tiers.economy]
model = "gpt-6-luna"
label = "luna"
supported_efforts = ["low", "medium", "high", "xhigh", "max"]

[runtimes.office_codex.tiers.balanced]
model = "gpt-6-sol"
label = "sol"
supported_efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]

[runtimes.office_codex.tiers.frontier]
model = "gpt-6-sol"
label = "sol"
supported_efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]

[runtimes.office_claude]
display_name = "Office Claude Code"
provider = "claude"
lead_tier = "frontier"
# Unnamed spawns; config/claude/settings.json sets CLAUDE_CODE_SUBAGENT_MODEL to match.
default_tier = "economy"
opencode_go = false

# Claude Code agent `model` values are aliases; `resolves_to` is the model ID
# config/claude/settings.json pins each alias to (ANTHROPIC_DEFAULT_<ALIAS>_MODEL).
[runtimes.office_claude.tiers.economy]
model = "sonnet"
label = "sonnet"
resolves_to = "claude-sonnet-5"
supported_efforts = ["low", "medium", "high", "xhigh", "max"]

[runtimes.office_claude.tiers.balanced]
model = "opus"
label = "opus"
resolves_to = "claude-opus-5-5"
supported_efforts = ["low", "medium", "high", "xhigh", "max"]

[runtimes.office_claude.tiers.frontier]
model = "opus"
label = "opus"
resolves_to = "claude-opus-5-5"
supported_efforts = ["low", "medium", "high", "xhigh", "max"]

