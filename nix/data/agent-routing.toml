[runtimes.personal_opencode_go.tiers.frontier]
model = "deepseek-v4.1-flash"
label = "deepseek"
supported_efforts = ["none", "low", "medium", "high", "xhigh", "max", "ultra"]

[profiles.office]
codex_runtime = "office_codex"
codex_lead_tier = "frontier"
codex_lead_effort = "high"
codex_default_tier = "economy"
codex_default_effort = "xhigh"
pi_runtime = "office_codex"
pi_tier = "frontier"
pi_effort = "high"

[profiles.personal]
codex_runtime = "personal_opencode_go"
codex_lead_tier = "frontier"
codex_lead_effort = "high"
